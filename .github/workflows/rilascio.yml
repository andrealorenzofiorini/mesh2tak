# Pubblica una release quando su main cambia la versione (VERSIONE in sorgenti/gateway/01-configurazione.py): costruisce i due file da
# consegnare e l'immagine per Raspberry Pi Imager (dalla 1.10.0), scrive SHA256SUMS e prende le novita' da
# NOVITA.md. Server e Raspberry si aggiornano solo da qui. Se un passo non riesce non si pubblica niente.
name: Rilascio

on:
  push:
    branches: [main, "prove/**"]      # sui rami prove/... girano solo le prove, senza pubblicare
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  # Dalla 1.16.0 le prove automatiche girano qui prima di ogni rilascio: se una non passa non si pubblica niente.
  # (I controlli sul Raspberry simulato, tests/prova_installatore.sh, restano da lanciare a mano.)
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PROVA_SSHD: /usr/sbin/sshd
    steps:
      - uses: actions/checkout@v4

      - name: Cosa serve alle prove
        run: |
          export TAKSDK="$RUNNER_TEMP/takpacket-sdk" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browser"
          { echo "TAKSDK=$TAKSDK"; echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"; } >> "$GITHUB_ENV"
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server dosfstools mtools xz-utils e2fsprogs fdisk
          sudo python3 -m pip install -q --break-system-packages pytest cryptography zstandard pypubsub \
            "pyserial>=3.5" "protobuf>=5.29,<8" "meshtastic==2.7.11"
          git clone -q https://github.com/meshtastic/TAKPacket-SDK "$TAKSDK"
          git -C "$TAKSDK" checkout -q c02c625f13226f39e30ff7ecdbfa8150783c1f70
          sudo mkdir -p /opt/prova-caddy
          for v in 2.10.2 2.6.4; do
            curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v$v/caddy_${v}_linux_amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP" caddy
            sudo install -m 755 "$RUNNER_TEMP/caddy" "/opt/prova-caddy/caddy-$v"
          done
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Prove
        run: |
          python3 build.py
          python3 -m py_compile mesh2tak.py scorta.py aggiorna.py primo_avvio.py server/rete_meshtastic.py
          # molte prove vogliono root (utenti, sshd, immagini di dischi): le variabili si passano una per una
          sudo env "PATH=$PATH" "TAKSDK=$TAKSDK" "PROVA_SSHD=$PROVA_SSHD" \
            "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" python3 -m pytest tests -q -p no:cacheprovider -rs

  rilascio:
    needs: prove
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build.py > /dev/null      # mesh2tak.py si monta dai pezzi di sorgenti/gateway
          V=$(sed -n 's/^VERSIONE = "\([0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\)"$/\1/p' mesh2tak.py | head -n1)
          [ -n "$V" ] || { echo "::error::VERSIONE in mesh2tak.py non e' del tipo X.Y.Z"; exit 1; }
          echo "versione=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La release v$V c'e' gia': niente da pubblicare."
            echo "nuova=no" >> "$GITHUB_OUTPUT"
          else
            echo "nuova=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Costruisci e controlla
        if: steps.v.outputs.nuova == 'si'
        env:
          V: ${{ steps.v.outputs.versione }}
        run: |
          python3 build.py
          python3 -m py_compile mesh2tak.py scorta.py aggiorna.py primo_avvio.py server/rete_meshtastic.py
          bash -n dist/installa-ponte-meshtastic.sh
          bash -n dist/rete-meshtastic.sh
          python3 -m py_compile dist/mesh2tak-primo-avvio.py
          grep -qx "VERSIONE=\"$V\"" dist/installa-ponte-meshtastic.sh
          grep -qx "VERSIONE = \"$V\"" dist/rete-meshtastic.sh
          grep -qx "VERSIONE = \"$V\"" dist/mesh2tak-primo-avvio.py

      - name: Novita'
        if: steps.v.outputs.nuova == 'si'
        env:
          V: ${{ steps.v.outputs.versione }}
        run: |
          awk -v t="## $V" '$0 == t || index($0, t " ") == 1 { dentro = 1; next } dentro && /^## / { exit } dentro { print }' \
            NOVITA.md > note.md
          grep -q '[^[:space:]]' note.md || { echo "::error::manca la sezione '## $V' in NOVITA.md"; exit 1; }
          cat note.md

      - name: Immagine per Raspberry Pi Imager
        if: steps.v.outputs.nuova == 'si'
        env:
          V: ${{ steps.v.outputs.versione }}
        run: |
          # parte dall'immagine ufficiale di Raspberry Pi OS Lite 64 bit (controllata) e ci aggiunge solo il primo
          # avvio del ponte: nessun indirizzo, chiave o certificato dentro
          sudo python3 immagine/costruisci.py --versione "$V" --agente dist/mesh2tak-primo-avvio.py \
            --uscita dist --lavoro "$RUNNER_TEMP/immagine" \
            --url-base "https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 -c "import json; j = json.load(open('dist/imager.json')); print(json.dumps(j['os_list'], indent=1))"
          cd dist && sha256sum installa-ponte-meshtastic.sh rete-meshtastic.sh "ponte-meshtastic-$V.img.xz" \
            imager.json icona-imager.png > SHA256SUMS && cat SHA256SUMS

      - name: Pubblica
        if: steps.v.outputs.nuova == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.versione }}
        run: |
          gh release create "v$V" dist/installa-ponte-meshtastic.sh dist/rete-meshtastic.sh dist/SHA256SUMS \
            "dist/ponte-meshtastic-$V.img.xz" dist/imager.json dist/icona-imager.png \
            --title "mesh2tak $V" --notes-file note.md --target "$GITHUB_SHA"
